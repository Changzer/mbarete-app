services:
  mbarete-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbarete
      # Reachable only on the compose network — never publish 5432. Override
      # via .env all the same; the app reads the same value below.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mbarete}
      POSTGRES_DB: mbarete
    volumes:
      - mbarete-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbarete -d mbarete"]
      interval: 5s
      timeout: 3s
      retries: 12

  mbarete-app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      mbarete-db:
        condition: service_healthy
    # /api/health answers 200 only when the database does — a hung process
    # or a dead DB connection flips the container unhealthy and Docker's
    # restart policy takes it from there.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      # The app runs as a non-superuser role so row-level security binds it;
      # the migration runner (admin URL below) creates and maintains that role.
      DATABASE_URL: postgres://mbarete_app:${DB_PASSWORD:-mbarete}@mbarete-db:5432/mbarete
      # Owner role: migrations and role upkeep only.
      DATABASE_ADMIN_URL: postgres://mbarete:${DB_PASSWORD:-mbarete}@mbarete-db:5432/mbarete
      COMPANY_NAME: ${COMPANY_NAME:-Mbarete}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Deployment mode. "self-hosted" (default) auto-seeds the single company
      # above and hides public signup. "saas" seeds nothing on boot and opens
      # the /signup flow, gated by SIGNUP_CODE.
      DEPLOY_MODE: ${DEPLOY_MODE:-self-hosted}
      # The invite code a person must present to create a company at /signup.
      # Only used in saas mode; an unset code keeps signup closed.
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      # The one account allowed into the platform panel (saas operations:
      # plans, seats, backups). Unset = the panel is closed for everyone.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      # Outbound email (reset/verification links). Unset = features hidden.
      # For Exmail/WeCom, SMTP_PASS is the client authorization code.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      # Optional: comma-separated forex provider URLs, tried in order.
      # Leave unset for the defaults (open.er-api.com, frankfurter.dev).
      FOREX_PROVIDERS: ${FOREX_PROVIDERS:-}
      # Automated backups: daily snapshot of database + uploads into the
      # backups volume below, pruned to BACKUP_RETENTION copies. See
      # docs/BACKUPS.md for what is kept and how to restore.
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      # AI photo transcription. Moonshot (Kimi) is preferred when set;
      # Anthropic (Claude) is the fallback. Unset both to hide the AI features.
      # Uptime dead-man's switch: while healthy the app GETs this URL every
      # minute; point it at a healthchecks.io check (or any ping monitor)
      # and silence becomes your alarm. Unset = off. ALERT_EMAIL receives
      # first-sighting server-error mails (falls back to the admin emails).
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-}
      MOONSHOT_DISABLE_THINKING: ${MOONSHOT_DISABLE_THINKING:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-}
    volumes:
      # Still mounted: the SQLite era's mbarete.db lives here, read once by
      # `npm run db:import-sqlite` and kept afterwards as a backup.
      - mbarete-data:/app/data
      # Same volume as before, remounted: uploads moved out of public/ because
      # standalone Next.js will not serve files written there after build.
      # Existing images keep working — they are still in this volume, and the
      # /uploads route now streams them from the new path.
      - mbarete-uploads:/app/uploads
      # Daily snapshots land here. Point BACKUP_DIR at a bind mount instead
      # (e.g. a different disk or a NAS share) to keep backups off the same
      # volume set as the data they protect.
      - mbarete-backups:/app/backups

volumes:
  mbarete-data:
  mbarete-pgdata:
  mbarete-uploads:
  mbarete-backups:
