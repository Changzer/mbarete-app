services:
  mbarete-app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Optional: comma-separated forex provider URLs, tried in order.
      # Leave unset for the defaults (open.er-api.com, frankfurter.dev).
      FOREX_PROVIDERS: ${FOREX_PROVIDERS:-}
      # AI photo transcription. Moonshot (Kimi) is preferred when set;
      # Anthropic (Claude) is the fallback. Unset both to hide the AI features.
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-}
      MOONSHOT_MODEL: ${MOONSHOT_MODEL:-}
      MOONSHOT_DISABLE_THINKING: ${MOONSHOT_DISABLE_THINKING:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-}
    volumes:
      - mbarete-data:/app/data
      # Same volume as before, remounted: uploads moved out of public/ because
      # standalone Next.js will not serve files written there after build.
      # Existing images keep working — they are still in this volume, and the
      # /uploads route now streams them from the new path.
      - mbarete-uploads:/app/uploads

volumes:
  mbarete-data:
  mbarete-uploads:
