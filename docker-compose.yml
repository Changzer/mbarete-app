services:
  mbarete-app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    volumes:
      - mbarete-data:/app/data
      # Same volume as before, remounted: uploads moved out of public/ because
      # standalone Next.js will not serve files written there after build.
      # Existing images keep working — they are still in this volume, and the
      # /uploads route now streams them from the new path.
      - mbarete-uploads:/app/uploads

volumes:
  mbarete-data:
  mbarete-uploads:
