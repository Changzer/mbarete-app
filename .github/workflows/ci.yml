name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbarete
          POSTGRES_PASSWORD: mbarete
          POSTGRES_DB: mbarete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbarete -d mbarete_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The app connects as the non-superuser role db:migrate creates, so the
      # RLS posture probe in check:isolation exercises the real deployment shape.
      DATABASE_URL: postgres://mbarete_app:mbarete@localhost:5432/mbarete_test
      DATABASE_ADMIN_URL: postgres://mbarete:mbarete@localhost:5432/mbarete_test
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run check:isolation
