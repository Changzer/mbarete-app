name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbarete
          POSTGRES_PASSWORD: mbarete
          POSTGRES_DB: mbarete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbarete -d mbarete_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The app connects as the non-superuser role db:migrate creates, so the
      # RLS posture probe in check:isolation exercises the real deployment shape.
      DATABASE_URL: postgres://mbarete_app:mbarete@localhost:5432/mbarete_test
      DATABASE_ADMIN_URL: postgres://mbarete:mbarete@localhost:5432/mbarete_test
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:vat-migration
      - run: npm run test:supplier-migration
      - run: npm run check:isolation

      # Entitlements only bind in SaaS mode; everything else in this job runs
      # self-hosted, where every cap answers yes — which is exactly how an
      # inverted product cap once shipped unseen. This step is the tripwire:
      # caps at the boundary, and two writers racing for the last slot.
      - run: npm run test:entitlements
        env:
          DEPLOY_MODE: saas

      # The golden path, end to end in a real browser: capture → draft →
      # AI read (stubbed vision API) → product → order → quote → invoice.
      # This chain is the product's whole promise, so it gates the merge.
      - run: npm run db:seed
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: change-me
      - run: npx playwright install --with-deps chromium
      - name: Start app against the vision stub
        id: start_app
        env:
          MOONSHOT_API_KEY: stub
          MOONSHOT_BASE_URL: http://localhost:9099
          UPLOADS_DIR: ${{ runner.temp }}/uploads
          # The NAS setup rehearsal pairs against these.
          BACKUP_DIR: ${{ runner.temp }}/backups
          NAS_REPORT_TOKEN: ci-nas-report-token
        run: |
          node scripts/e2e/vision-stub.mjs &
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null -I http://localhost:3000/api/drafts && exit 0
            sleep 1
          done
          echo "app never became healthy" && exit 1
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}

      # Continuous field capture in the same browser and against the same
      # server: per-photo persistence and reload recovery, booth visits and
      # a supplier decided before every capture has arrived, a delivery whose
      # response is lost after the server committed, addenda offline and
      # after delivery, the legacy queue across the store upgrade, and
      # another account's captures staying on the phone.
      - run: npm run test:capture
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - run: npm run test:vat
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - run: npm run test:order-status
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - name: Upload order status screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-status-review
          path: artifacts/order-status
          if-no-files-found: ignore
          retention-days: 7
      # The follow-up board: cards per supplier from a confirmed order, stage
      # moves (button and drag), next step and who, checklist, a Chinese
      # update with a photo, a stale save refused, and a shipped order's
      # export paperwork read from the dossier.
      - run: npm run test:followup
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        env:
          UPLOADS_DIR: ${{ runner.temp }}/uploads
      - name: Upload follow-up board screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followup-review
          path: artifacts/followup
          if-no-files-found: ignore
          retention-days: 7
      # The task bell: a step and a checklist item handed to a colleague ring
      # their bell once, opening it is reading it, a task opens its card, and
      # a stage move by someone else is new again.
      - run: npm run test:tasks
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - name: Upload task bell screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-review
          path: artifacts/tasks
          if-no-files-found: ignore
          retention-days: 7
      # A chat assistant with a key: added on the Team page, reads an order
      # without prices, moves a card and posts under its own name, and is
      # refused what it was not allowed, other companies, bank details,
      # deletes, and its old key after a new one.
      - run: npm run test:assistant
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - name: Upload assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-review
          path: artifacts/assistant
          if-no-files-found: ignore
          retention-days: 7
      # Customs documents: suppliers' province and city through the form,
      # each line's 境内货源地 and the marks in the pack, the 委托书 sheet, and
      # one carton label per box.
      - run: npm run test:customs
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      # The two-command NAS setup against the running app: the server script
      # opens a pairing, the NAS script hands its key over, the key lands
      # read-only, and the first copy runs through that very line.
      - run: npm run test:nas-setup
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          UPLOADS_DIR: ${{ runner.temp }}/uploads
      - name: Upload customs documents review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customs-review
          path: artifacts/customs
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:documents
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        env:
          UPLOADS_DIR: ${{ runner.temp }}/uploads
      - name: Upload supplier VAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-vat-review
          path: artifacts/supplier-vat
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:landed-cost
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
      - name: Upload export estimate review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landed-cost-review
          path: artifacts/landed-cost
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:landing
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        env:
          UPLOADS_DIR: ${{ runner.temp }}/uploads
      # Several fresh browser passes catch the production-only head hydration
      # race that a single happy-path visit previously missed.
      - name: Check public navigation stability
        if: ${{ !cancelled() && steps.start_app.outcome == 'success' }}
        run: |
          for navigation_pass in 1 2 3; do
            node --test --test-name-pattern='service page' src/ui-tests/landing.spec.mjs
          done
      - name: Upload landing review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-review
          path: artifacts/landing
          if-no-files-found: ignore
          retention-days: 7

      # The disaster drill on the data the golden path just created: back it
      # up, damage rows and files, prove a corrupted backup is refused before
      # anything is truncated, then restore the intact one exactly.
      - run: npm run test:backup
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
          UPLOADS_DIR: ${{ runner.temp }}/uploads
